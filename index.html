<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una palabra para tu corazón</title>

    <link rel="stylesheet" href="static/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="logo">✧ CONÉCTATE CON DIOS ✧</div>
    </header>

    <main class="contenedor">

        <div class="decoracion">✦</div>

        <p class="subtitulo">UN MENSAJE ESPECIAL PARA TI</p>

        <h1>Una palabra<br>
            <span>para tu corazón</span>
        </h1>

        <p class="introduccion">
            No llegaste aquí por casualidad.
            Permite que hoy la Palabra de Dios
            ilumine tu camino.
        </p>

        <section class="tarjeta">

            <div class="comilla">“</div>

            <p id="texto-versiculo">
                Cargando una palabra...
            </p>

            <div class="linea"></div>

            <p id="referencia"></p>

        </section>

        <button onclick="recibirVersiculo()">
            ✨ Recibir otra palabra
        </button>

        <p class="mensaje-final">
            Dios te ama más de lo que imaginas.
        </p>

    </main>

    <footer>
        Con amor, compartiendo la Palabra de Dios ♡
    </footer>

    <script>
        let versiculos = [];
        let ultimoIndice = -1;

        async function cargarVersiculos() {
            try {
                const respuesta = await fetch('https://raw.githubusercontent.com/loren-091/PALABRA_DE_VIDA/main/versiculos.json');

                if (!respuesta.ok) {
                    throw new Error('No se pudo cargar el archivo');
                }

                versiculos = await respuesta.json();
                recibirVersiculo();

            } catch (error) {
                document.getElementById('texto-versiculo').textContent =
                    'No se pudieron cargar los versículos. Intenta actualizar la página.';
                console.error(error);
            }
        }

        function recibirVersiculo() {
            if (versiculos.length === 0) return;

            let indice;

            do {
                indice = Math.floor(Math.random() * versiculos.length);
            } while (
                versiculos.length > 1 &&
                indice === ultimoIndice
            );

            ultimoIndice = indice;

            const datos = versiculos[indice];

            document.getElementById('texto-versiculo').textContent =
                datos.texto;

            document.getElementById('referencia').textContent =
                datos.referencia;
        }

        cargarVersiculos();
    </script>

</body>
</html>
