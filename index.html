<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una palabra para tu corazón</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header><div class="logo">✧ CONÉCTATE CON DIOS ✧</div></header>

    <main class="contenedor">
        <div class="decoracion">✦</div>
        <p class="subtitulo">UN MENSAJE ESPECIAL PARA TI</p>
        <h1>Una palabra<br><span>para tu corazón</span></h1>
        <p class="introduccion">
            No llegaste aquí por casualidad.
            Permite que hoy la Palabra de Dios
            ilumine tu camino.
        </p>

        <section class="tarjeta">
            <div class="comilla">“</div>
            <p id="texto-versiculo"></p>
            <div class="linea"></div>
            <p id="referencia"></p>
        </section>

        <button onclick="recibirVersiculo()">✨ Recibir otra palabra</button>
        <p class="mensaje-final">Dios te ama más de lo que imaginas.</p>
    </main>

    <footer>Con amor, compartiendo la Palabra de Dios ♡</footer>

    <script>
        const versiculos = [{"texto": "Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.", "referencia": "Juan 3:16"}, {"texto": "Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros.", "referencia": "Romanos 5:8"}, {"texto": "Nosotros le amamos a él, porque él nos amó primero.", "referencia": "1 Juan 4:19"}, {"texto": "Jehová se manifestó a mí hace ya mucho tiempo, diciendo: Con amor eterno te he amado; por tanto, con misericordia te he atraído.", "referencia": "Jeremías 31:3"}, {"texto": "Porque no envió Dios a su Hijo al mundo para que condene al mundo, mas para que el mundo sea salvo por él.", "referencia": "Juan 3:17"}, {"texto": "En esto está el amor, no en que nosotros hayamos amado a Dios, sino en que él nos amó a nosotros, y envió a su Hijo en propiciación por nuestros pecados.", "referencia": "1 Juan 4:10"}, {"texto": "Pero Dios, que es rico en misericordia, por su gran amor con que nos amó, aun cuando estábamos muertos en delitos, nos dio vida juntamente con Cristo —por gracia sois salvos—.", "referencia": "Efesios 2:4-5"}, {"texto": "Nadie tiene mayor amor que este, que uno ponga su vida por sus amigos.", "referencia": "Juan 15:13"}, {"texto": "Porque para mí fuiste de gran precio, y fuiste amado; te daré hombres por ti, y pueblos por tu vida.", "referencia": "Isaías 43:4"}, {"texto": "Y nosotros hemos conocido y creído el amor que Dios tiene para con nosotros. Dios es amor; y el que permanece en amor, permanece en Dios, y Dios en él.", "referencia": "1 Juan 4:16"}, {"texto": "Por cuanto todos pecaron, y están destituidos de la gloria de Dios, siendo justificados gratuitamente por su gracia, mediante la redención que es en Cristo Jesús.", "referencia": "Romanos 3:23-24"}, {"texto": "Porque la paga del pecado es muerte, mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro.", "referencia": "Romanos 6:23"}, {"texto": "Ciertamente no hay hombre justo en la tierra, que haga el bien y nunca peque.", "referencia": "Eclesiastés 7:20"}, {"texto": "Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino; mas Jehová cargó en él el pecado de todos nosotros.", "referencia": "Isaías 53:6"}, {"texto": "Porque no hay hombre que no peque.", "referencia": "1 Reyes 8:46"}, {"texto": "Antes la Escritura lo encierra todo bajo el pecado, para que la promesa por la fe de Jesucristo fuese dada a los que creen.", "referencia": "Gálatas 3:22"}, {"texto": "Entonces la concupiscencia, después que ha concebido, da a luz el pecado; y el pecado, siendo consumado, da a luz la muerte.", "referencia": "Santiago 1:15"}, {"texto": "Pero vuestras iniquidades han hecho división entre vosotros y vuestro Dios, y vuestros pecados han hecho ocultar de vosotros su rostro para no oír.", "referencia": "Isaías 59:2"}, {"texto": "Engañoso es el corazón más que todas las cosas, y perverso; ¿quién lo conocerá?", "referencia": "Jeremías 17:9"}, {"texto": "Hay camino que al hombre le parece derecho; pero su fin es camino de muerte.", "referencia": "Proverbios 14:12"}, {"texto": "Y en ningún otro hay salvación; porque no hay otro nombre bajo el cielo, dado a los hombres, en que podamos ser salvos.", "referencia": "Hechos 4:12"}, {"texto": "Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí.", "referencia": "Juan 14:6"}, {"texto": "Porque también Cristo padeció una sola vez por los pecados, el justo por los injustos, para llevarnos a Dios, siendo a la verdad muerto en la carne, pero vivificado en espíritu.", "referencia": "1 Pedro 3:18"}, {"texto": "Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados.", "referencia": "Isaías 53:5"}, {"texto": "El siguiente día vio Juan a Jesús que venía a él, y dijo: He aquí el Cordero de Dios, que quita el pecado del mundo.", "referencia": "Juan 1:29"}, {"texto": "Porque primeramente os he enseñado lo que asimismo recibí: Que Cristo murió por nuestros pecados, conforme a las Escrituras; y que fue sepultado, y que resucitó al tercer día, conforme a las Escrituras.", "referencia": "1 Corintios 15:3-4"}, {"texto": "Al que no conoció pecado, por nosotros lo hizo pecado, para que nosotros fuésemos hechos justicia de Dios en él.", "referencia": "2 Corintios 5:21"}, {"texto": "Porque hay un solo Dios, y un solo mediador entre Dios y los hombres, Jesucristo hombre, el cual se dio a sí mismo en rescate por todos, de lo cual se dio testimonio a su debido tiempo.", "referencia": "1 Timoteo 2:5-6"}, {"texto": "Por lo cual puede también salvar perpetuamente a los que por él se acercan a Dios, viviendo siempre para interceder por ellos.", "referencia": "Hebreos 7:25"}, {"texto": "Y cantaban un nuevo cántico, diciendo: Digno eres de tomar el libro y de abrir sus sellos; porque tú fuiste inmolado, y con tu sangre nos has redimido para Dios, de todo linaje y lengua y pueblo y nación.", "referencia": "Apocalipsis 5:9"}, {"texto": "Y ellos dijeron: Cree en el Señor Jesucristo, y serás salvo, tú y tu casa.", "referencia": "Hechos 16:31"}, {"texto": "Que si confesares con tu boca que Jesús es el Señor, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo. Porque con el corazón se cree para justicia, pero con la boca se confiesa para salvación.", "referencia": "Romanos 10:9-10"}, {"texto": "Porque todo aquel que invocare el nombre del Señor, será salvo.", "referencia": "Romanos 10:13"}, {"texto": "Mas a todos los que le recibieron, a los que creen en su nombre, les dio el derecho de llegar a ser hijos de Dios.", "referencia": "Juan 1:12"}, {"texto": "He aquí, yo estoy a la puerta y llamo; si alguno oye mi voz y abre la puerta, entraré a él, y cenaré con él, y él conmigo.", "referencia": "Apocalipsis 3:20"}, {"texto": "Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados, y limpiarnos de toda maldad.", "referencia": "1 Juan 1:9"}, {"texto": "Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.", "referencia": "Mateo 11:28"}, {"texto": "Todo lo que el Padre me da, vendrá a mí; y al que a mí viene, no le echo fuera.", "referencia": "Juan 6:37"}, {"texto": "Venid luego, dice Jehová, y estemos a cuenta: si vuestros pecados fueren como la grana, como la nieve serán emblanquecidos; si fueren rojos como el carmesí, vendrán a ser como blanca lana.", "referencia": "Isaías 1:18"}, {"texto": "Y me buscaréis y me hallaréis, porque me buscaréis de todo vuestro corazón.", "referencia": "Jeremías 29:13"}, {"texto": "De cierto, de cierto os digo: El que oye mi palabra, y cree al que me envió, tiene vida eterna; y no vendrá a condenación, mas ha pasado de muerte a vida.", "referencia": "Juan 5:24"}, {"texto": "Mis ovejas oyen mi voz, y yo las conozco, y me siguen, y yo les doy vida eterna; y no perecerán jamás, ni nadie las arrebatará de mi mano.", "referencia": "Juan 10:27-28"}, {"texto": "Y este es el testimonio: que Dios nos ha dado vida eterna; y esta vida está en su Hijo. El que tiene al Hijo, tiene la vida; el que no tiene al Hijo de Dios, no tiene la vida. Estas cosas os he escrito a vosotros que creéis en el nombre del Hijo de Dios, para que sepáis que tenéis vida eterna.", "referencia": "1 Juan 5:11-13"}, {"texto": "Como dista el oriente del occidente, Así alejó de nosotros nuestras rebeliones.", "referencia": "Salmo 103:12"}, {"texto": "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas.", "referencia": "2 Corintios 5:17"}, {"texto": "Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu.", "referencia": "Romanos 8:1"}, {"texto": "Cercano está Jehová a los quebrantados de corazón; Y salva a los contritos de espíritu.", "referencia": "Salmo 34:18"}, {"texto": "Porque el Hijo del Hombre ha venido para buscar y salvar lo que se había perdido.", "referencia": "Lucas 19:10"}, {"texto": "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.", "referencia": "Jeremías 29:11"}, {"texto": "Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.", "referencia": "Lamentaciones 3:22-23"}, {"texto": "Así que, arrepentíos y convertíos, para que sean borrados vuestros pecados; para que vengan de la presencia del Señor tiempos de refrigerio.", "referencia": "Hechos 3:19"}, {"texto": "Porque la tristeza que es según Dios produce arrepentimiento para salvación, de que no hay que arrepentirse; pero la tristeza del mundo produce muerte.", "referencia": "2 Corintios 7:10"}, {"texto": "Pero Dios, habiendo pasado por alto los tiempos de esta ignorancia, ahora manda a todos los hombres en todo lugar, que se arrepientan.", "referencia": "Hechos 17:30"}, {"texto": "Y diciendo: El tiempo se ha cumplido, y el reino de Dios se ha acercado; arrepentíos, y creed en el evangelio.", "referencia": "Marcos 1:15"}, {"texto": "El que encubre sus pecados no prosperará; Mas el que los confiesa y se aparta alcanzará misericordia.", "referencia": "Proverbios 28:13"}, {"texto": "Os digo que así habrá más gozo en el cielo por un pecador que se arrepiente, que por noventa y nueve justos que no necesitan arrepentimiento.", "referencia": "Lucas 15:7"}, {"texto": "Diles: Vivo yo, dice Jehová el Señor, que no quiero la muerte del impío, sino que se vuelva el impío de su camino, y que viva. Volveos, volveos de vuestros malos caminos; ¿por qué moriréis, casa de Israel?", "referencia": "Ezequiel 33:11"}, {"texto": "¿O menosprecias las riquezas de su benignidad, paciencia y longanimidad, ignorando que su benignidad te guía al arrepentimiento?", "referencia": "Romanos 2:4"}, {"texto": "Entonces Pedro les dijo: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo. Porque para vosotros es la promesa, y para vuestros hijos, y para todos los que están lejos; para cuantos el Señor nuestro Dios llamare.", "referencia": "Hechos 2:38-39"}, {"texto": "Desde los días de vuestros padres os habéis apartado de mis leyes, y no las guardasteis. Volveos a mí, y yo me volveré a vosotros, ha dicho Jehová de los ejércitos. Mas dijisteis: ¿En qué hemos de volvernos?", "referencia": "Malaquías 3:7"}, {"texto": "Por tanto, id, y haced discípulos a todas las naciones, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo; enseñándoles que guarden todas las cosas que os he mandado; y he aquí yo estoy con vosotros todos los días, hasta el fin del mundo. Amén.", "referencia": "Mateo 28:19-20"}, {"texto": "Y les dijo: Id por todo el mundo y predicad el evangelio a toda criatura.", "referencia": "Marcos 16:15"}, {"texto": "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego.", "referencia": "Romanos 1:16"}, {"texto": "Cantad a Jehová, bendecid su nombre; anunciad de día en día su salvación. Contad entre las naciones su gloria, Y en todos los pueblos sus maravillas.", "referencia": "Salmo 96:2-3"}, {"texto": "¡Cuán hermosos sobre los montes son los pies del que trae alegres nuevas, del que hace oír la paz, del que trae alegres nuevas de bien, del que hace oír la salvación, del que dice a Sión: ¡Reina tu Dios!", "referencia": "Isaías 52:7"}, {"texto": "Vosotros sois la luz del mundo; una ciudad asentada sobre un monte no se puede esconder. Ni se enciende una luz y se pone debajo de un almud, sino sobre el candelero, y alumbra a todos los que están en casa. Así alumbre vuestra luz delante de los hombres, para que vean vuestras buenas obras, y glorifiquen a vuestro Padre que está en los cielos.", "referencia": "Mateo 5:14-16"}, {"texto": "Santificad pues al Señor Dios en vuestros corazones; y estad siempre preparados para presentar defensa con mansedumbre y reverencia ante todo el que os demande razón de la esperanza que hay en vosotros.", "referencia": "1 Pedro 3:15"}, {"texto": "Entonces dijo a sus discípulos: A la verdad la mies es mucha, mas los obreros pocos. Rogad, pues, al Señor de la mies, que envíe obreros a su mies.", "referencia": "Mateo 9:37-38"}, {"texto": "Pero recibiréis poder, cuando haya venido sobre vosotros el Espíritu Santo, y me seréis testigos en Jerusalén, en toda Judea, en Samaria, y hasta lo último de la tierra.", "referencia": "Hechos 1:8"}, {"texto": "Predica la palabra; insta a tiempo y fuera de tiempo; redarguye, reprende, exhorta con toda paciencia y doctrina.", "referencia": "2 Timoteo 4:2"}, {"texto": "Y de la manera que está establecido para los hombres que mueran una sola vez, y después de esto el juicio.", "referencia": "Hebreos 9:27"}, {"texto": "Y vi un gran trono blanco y al que estaba sentado en él, de delante del cual huyeron la tierra y el cielo, y no se halló lugar para ellos. Y vi a los muertos, grandes y pequeños, de pie ante Dios; y los libros fueron abiertos, y otro libro fue abierto, el cual es el libro de la vida; y fueron juzgados los muertos por las cosas que estaban escritas en los libros, según sus obras.", "referencia": "Apocalipsis 20:11-12"}, {"texto": "E irán estos al castigo eterno, mas los justos a la vida eterna.", "referencia": "Mateo 25:46"}, {"texto": "Porque es necesario que todos nosotros comparezcamos ante el tribunal de Cristo, para que cada uno reciba según lo que haya hecho por medio del cuerpo, sea bueno o sea malo.", "referencia": "2 Corintios 5:10"}, {"texto": "De manera que cada uno de nosotros dará a Dios cuenta de sí.", "referencia": "Romanos 14:12"}, {"texto": "Pero los cobardes e incrédulos, los abominables y homicidas, los fornicarios y hechiceros, los idólatras y todos los mentirosos tendrán su parte en el lago que arde con fuego y azufre, que es la muerte segunda.", "referencia": "Apocalipsis 21:8"}, {"texto": "El que en el Hijo cree, tiene vida eterna; mas el que no obedece al Hijo, no verá la vida, sino que la ira de Dios permanece sobre él.", "referencia": "Juan 3:36"}, {"texto": "Volveos a mi reprensión; He aquí yo derramaré mi espíritu sobre vosotros, Os haré saber mis palabras.", "referencia": "Proverbios 1:23"}, {"texto": "¡Ay de los que a lo malo dicen bueno, y a lo bueno malo; que hacen de la luz tiniebla, y de las tinieblas luz; que ponen lo amargo por dulce, y lo dulce por amargo!", "referencia": "Isaías 5:20"}, {"texto": "No os engañéis; Dios no puede ser burlado, pues todo lo que el hombre sembrara, eso también segará. Porque el que siembra para su carne, de la carne segará corrupción; mas el que siembra para el Espíritu, del Espíritu segará vida eterna.", "referencia": "Gálatas 6:7-8"}, {"texto": "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios; no por obras, para que nadie se gloríe.", "referencia": "Efesios 2:8-9"}, {"texto": "No por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, nos salvó, por el lavamiento de la regeneración y por la renovación en el Espíritu Santo.", "referencia": "Tito 3:5"}, {"texto": "Pero donde abundó el pecado, sobreabundó la gracia; para que así como reinó el pecado en muerte, así también la gracia reine por la justicia para vida eterna por Jesucristo Señor nuestro.", "referencia": "Romanos 5:20-21"}, {"texto": "Antes creemos que por la gracia del Señor Jesús, del mismo modo que ellos, seremos salvos.", "referencia": "Hechos 15:11"}, {"texto": "Y al que obra, no se le cuenta la recompensa como gracia, sino como deuda; pero al que no obra, sino que cree en el que justifica al impío, su fe le es contada por justicia.", "referencia": "Romanos 4:4-5"}, {"texto": "Mas el Dios de toda gracia, que nos llamó a su gloria eterna en Jesucristo, después que hayáis padecido un poco de tiempo, él mismo os perfeccione, afirme, fortalezca y establezca.", "referencia": "1 Pedro 5:10"}, {"texto": "Y Dios es poderoso para hacer que toda gracia abunde para vosotros, a fin de que, teniendo siempre en todas las cosas todo lo suficiente, abundéis para toda buena obra.", "referencia": "2 Corintios 9:8"}, {"texto": "Porque de su plenitud tomamos todos, y gracia sobre gracia. Pues la ley por medio de Moisés fue dada, pero la gracia y la verdad vinieron por medio de Jesucristo.", "referencia": "Juan 1:16-17"}, {"texto": "Porque tú, Señor, eres bueno y perdonador, Y grande en misericordia para con los que te invocan.", "referencia": "Salmo 86:5"}, {"texto": "Para alabanza de la gloria de su gracia, con la cual nos hizo aceptos en el Amado; en quien tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia.", "referencia": "Efesios 1:6-7"}, {"texto": "Y me dijo: Bástate mi gracia; porque mi poder se perfecciona en la debilidad. Por tanto, de buena gana me gloriaré más bien en mis debilidades, para que repose sobre mí el poder de Cristo.", "referencia": "2 Corintios 12:9"}, {"texto": "Misericordioso y clemente es Jehová, Lento para la ira y grande en misericordia. No contenderá para siempre, Ni para siempre guardará el enojo. No ha hecho con nosotros conforme a nuestras iniquidades, Ni nos ha pagado conforme a nuestros pecados. Porque como la altura de los cielos sobre la tierra, Engrandeció su misericordia sobre los que le temen.", "referencia": "Salmo 103:8-11"}, {"texto": "Y si por gracia, ya no es por obras; de otra manera la gracia ya no es gracia. Y si por obras, ya no es gracia; de otra manera la obra ya no es obra.", "referencia": "Romanos 11:6"}, {"texto": "Y rasgad vuestro corazón, y no vuestros vestidos, y convertíos a Jehová vuestro Dios; porque misericordioso es y clemente, tardo para la ira y grande en misericordia, y que se duele del castigo.", "referencia": "Joel 2:13"}, {"texto": "Clemente y misericordioso es Jehová, Lento para la ira y grande en misericordia. Bueno es Jehová para con todos, Y sus misericordias sobre todas sus obras.", "referencia": "Salmo 145:8-9"}, {"texto": "¿Qué Dios como tú, que perdonas la maldad, y olvidas el pecado del remanente de su heredad? No retuvo para siempre su enojo, porque se deleita en misericordia. Él volverá a tener misericordia de nosotros; sepultará nuestras iniquidades, y echará a lo profundo del mar todos nuestros pecados.", "referencia": "Miqueas 7:18-19"}, {"texto": "Ten piedad de mí, oh Dios, conforme a tu misericordia; Conforme a la multitud de tus piedades borra mis rebeliones. Lávame más y más de mi maldad, Y límpiame de mi pecado.", "referencia": "Salmo 51:1-2"}, {"texto": "Bendito el Dios y Padre de nuestro Señor Jesucristo, que según su grande misericordia nos hizo renacer para una esperanza viva, por la resurrección de Jesucristo de los muertos, para una herencia incorruptible, inmaculada, y que no se marchita, reservada en los cielos para vosotros, que sois guardados por el poder de Dios mediante la fe, para alcanzar la salvación que está preparada para ser manifestada en el tiempo postrero.", "referencia": "1 Pedro 1:3-5"}, {"texto": "Alabad a Jehová, porque él es bueno; porque para siempre es su misericordia. Alabad al Dios de los dioses, porque para siempre es su misericordia. Alabad al Señor de los señores, porque para siempre es su misericordia.", "referencia": "Salmo 136:1-3"}, {"texto": "Sed, pues, misericordiosos, como también vuestro Padre es misericordioso.", "referencia": "Lucas 6:36"}];
        let ultimoIndice = -1;

        function recibirVersiculo() {
            if (versiculos.length === 0) return;

            let indice;
            do {
                indice = Math.floor(Math.random() * versiculos.length);
            } while (versiculos.length > 1 && indice === ultimoIndice);

            ultimoIndice = indice;
            const datos = versiculos[indice];

            document.getElementById("texto-versiculo").textContent = datos.texto;
            document.getElementById("referencia").textContent = datos.referencia;
        }

        recibirVersiculo();
    </script>
</body>
</html>
